<!doctype html>
<!-- GitHub social preview (1280x640, upload in Settings > Social preview). Render with `sh scripts/social-preview.sh`. -->
<html lang="en"><head><meta charset="utf-8"><title>Rust Anything social preview</title>
<style>
  @font-face { font-family: Mona; src: url("../../website/node_modules/@fontsource-variable/mona-sans/files/mona-sans-latin-wdth-normal.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: Plex; src: url("../../website/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: #fafafa;
    background-image: radial-gradient(#dadada 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    color: #111;
    font-family: Mona, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #b34a1a; }
  .crab { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 450px; height: auto; }
  .text { position: absolute; left: 490px; right: 44px; top: 44px; }
  .name { display: flex; align-items: center; gap: 12px; font-size: 38px; font-weight: 600; letter-spacing: -0.01em; }
  .name .rust, .tag span { color: #b34a1a; }
  h1 { margin-top: 14px; font-size: 62px; font-weight: 700; line-height: 1.04; letter-spacing: -0.03em; }
  .tag { display: contents; }
  .tag span { display: block; }
  .stats { display: flex; gap: 12px; margin-top: 30px; }
  .stat { flex: 1; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1.5px solid #e2e2e2; }
  .stat b { display: block; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .stat small { display: block; margin-top: 4px; font-size: 19px; line-height: 1.3; color: #5b5b5b; }
  .gh { display: flex; gap: 12px; margin-top: 22px; }
  .langs { margin-top: 18px; font-size: 18px; color: #5b5b5b; }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-size: 22px; color: #5b5b5b; }
  .foot img { height: 32px; vertical-align: middle; }
  .url { display: inline-flex; align-items: center; font-family: Plex; font-size: 23px; color: #111; padding: 6px 12px; border: 1.5px solid #111; border-radius: 10px; background: #fff; }
</style></head>
<body>
  <img class="crab" src="logo.png" alt="">
  <div class="text">
    <div class="name"><span><span class="rust">Rust</span> Anything</span></div>
    <h1>Rewrite your app in Rust.<span class="tag"><span>Prove it behaves the same.</span></span></h1>
    <div class="stats">
      <div class="stat"><b>19x</b><small>faster Prettier</small></div>
      <div class="stat"><b>21x</b><small>lighter json-server</small></div>
      <div class="stat"><b>10</b><small>languages</small></div>
    </div>
    <div class="gh">
      <span class="url">rustanything.ai</span>
    </div>
    <div class="foot">Sponsored by <img src="brands/coderabbit.png" alt=""> <b style="color:#111">CodeRabbit</b> and <img src="sponsors/atak-domain.svg" alt="Atak Domain"></div>
  </div>
  <div class="bar"></div>
</body></html>
